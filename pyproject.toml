[tool.poetry]
name = "mxm-types"
version = "0.3.1"
description = "Shared foundational types and representation adapters for Money Ex Machina."
authors = ["mxm <contact@moneyexmachina.com>"]
license = "MIT"
readme = "README.md"
keywords = [
  "money-ex-machina",
  "types",
  "typing",
  "timestamps",
  "numpy",
  "pandas",
  "json",
  "pep561",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
packages = [{ include = "mxm", from = "src" }]
include = [
  { path = "LICENSE" },
  { path = "src/mxm/types/py.typed", format = "wheel" },
]

[tool.poetry.urls]
"Homepage" = "https://github.com/moneyexmachina/mxm-types"
"Repository" = "https://github.com/moneyexmachina/mxm-types"
"Issues" = "https://github.com/moneyexmachina/mxm-types/issues"

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
numpy = "^2.4.4"
pandas = ">=2.3.3,<4.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.3"
black = "^25.9.0"
isort = "^7.0.0"
ipython = "^9.5.0"
pytest = "^8.4.2"
pyright = "^1.1.407"

[tool.poetry.scripts]
# (none)

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
# ---- Tooling (package-local, MXM defaults) ----
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mxm"]
combine_as_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E","F","I","B","UP","C90","RUF"]
ignore = ["E203","E501"]

[tool.ruff.lint.isort]
known-first-party = ["mxm"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
